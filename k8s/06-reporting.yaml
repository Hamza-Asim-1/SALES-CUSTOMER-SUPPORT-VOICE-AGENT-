apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting
  namespace: fyp
  labels:
    app: reporting
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting
  template:
    metadata:
      labels:
        app: reporting
        tier: backend
    spec:
      containers:
        - name: reporting
          image: fyp/reporting-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6000
          envFrom:
            - secretRef:
                name: backend-secret
          # Pydantic BaseSettings reads env vars injected here before any .env file
          # so the working-directory .env issue does not apply in Kubernetes
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 6000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 6000
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: reporting
  namespace: fyp
spec:
  selector:
    app: reporting
  ports:
    - port: 6000
      targetPort: 6000
