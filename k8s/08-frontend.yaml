apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fyp
  labels:
    app: frontend
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: fyp/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            # CRM API — points to in-cluster crm service
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "http://crm:5000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fyp
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
