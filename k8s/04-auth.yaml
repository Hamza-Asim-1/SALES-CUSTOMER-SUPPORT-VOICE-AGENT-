apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: fyp
  labels:
    app: auth
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
        tier: backend
    spec:
      containers:
        - name: auth
          # Replace with your registry: docker.io/<user>/fyp-auth:latest
          image: fyp/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 2000
          envFrom:
            - secretRef:
                name: backend-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 2000
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: fyp
spec:
  selector:
    app: auth
  ports:
    - port: 2000
      targetPort: 2000
