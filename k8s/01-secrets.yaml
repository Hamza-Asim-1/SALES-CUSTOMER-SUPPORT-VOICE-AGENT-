# ================================================================
# Kubernetes Secrets — AI Sales Automation
#
# One single Secret (backend-secret) holds ALL backend env vars.
# Pods load it via envFrom so each service naturally picks up only
# the variables it uses, ignoring the rest.
#
# HOW TO CREATE (recommended — never commit real values to YAML):
#
#   1. Fill in backend/.env with real credentials
#   2. Run:
#      kubectl create secret generic backend-secret \
#        --from-env-file=./backend/.env \
#        -n fyp \
#        --dry-run=client -o yaml | kubectl apply -f -
#
# HOW TO UPDATE (rotate a credential):
#      kubectl create secret generic backend-secret \
#        --from-env-file=./backend/.env \
#        -n fyp \
#        --dry-run=client -o yaml | kubectl apply -f -
#      kubectl rollout restart deployment/<name> -n fyp
#
# ── Placeholder YAML (for GitOps / sealed-secrets workflows) ────
# Replace every <base64-encoded-...> with:
#   [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("real-value"))  # PowerShell
#   echo -n "real-value" | base64                                             # bash
# ================================================================

apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: fyp
type: Opaque
data:
  # ---- Supabase ----
  SUPABASE_URL: <base64-encoded-supabase-project-url>
  SUPABASE_KEY: <base64-encoded-supabase-anon-key>
  supabase_url: <base64-encoded-supabase-project-url>
  supabase_key: <base64-encoded-supabase-anon-key>
  SERVICE_ROLE: <base64-encoded-supabase-service-role-key>
  PSQL_URL: <base64-encoded-postgres-connection-string>

  # ---- Auth ----
  encryption_key: <base64-encoded-fernet-key>
  secret_key: <base64-encoded-jwt-secret>
  algorithm: SFMyNTY=   # base64("HS256")
  access_token_expire_minutes: MzA=   # base64("30")

  # ---- Groq ----
  GROQ_API_KEY: <base64-encoded-groq-api-key>
  LLM_MODEL: bGxhbWEtMy4zLTcwYi12ZXJzYXRpbGU=   # base64("llama-3.3-70b-versatile")

  # ---- Reporting ----
  QDRANT_CLUSTER_URL: <base64-encoded-qdrant-url>
  QDRANT_API_KEY: <base64-encoded-qdrant-api-key>
  SEGMIND_API_KEY: <base64-encoded-segmind-api-key>
  MEM0_API_KEY: <base64-encoded-mem0-api-key>
  MAX_FILE_SIZE_MB: NTA=   # base64("50")

  # ---- Sales agent email ----
  EMAIL_USER: <base64-encoded-email-address>
  EMAIL_PASS: <base64-encoded-email-app-password>

  # ---- Twilio ----
  Twilio_ACCOUNT_SID: <base64-encoded-twilio-account-sid>
  Twilio_AUTH_TOKEN: <base64-encoded-twilio-auth-token>
  TWILIO_NUMBER: <base64-encoded-twilio-phone-number>
  ACCOUNT_SID: <base64-encoded-twilio-account-sid>
  AUTH_TOKEN: <base64-encoded-twilio-auth-token>

  # ---- ElevenLabs ----
  eleven_labs_key: <base64-encoded-elevenlabs-api-key>

  # ---- Public webhook URL ----
  PUBLIC_URL: <base64-encoded-public-url>

---
# Frontend secret (only the CRM base URL is env-driven at runtime;
# auth/reporting URLs are still hardcoded in source — see LOCAL_SETUP.md)
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secret
  namespace: fyp
type: Opaque
data:
  NEXT_PUBLIC_API_BASE_URL: <base64-encoded-crm-service-url>
