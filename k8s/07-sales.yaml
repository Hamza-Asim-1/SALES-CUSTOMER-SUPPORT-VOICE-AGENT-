apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales
  namespace: fyp
  labels:
    app: sales
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sales
  template:
    metadata:
      labels:
        app: sales
        tier: backend
    spec:
      containers:
        - name: sales
          image: fyp/sales-agent-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: backend-secret
            - configMapRef:
                name: app-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1"

---
# Sales Celery worker — same image, different command
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-worker
  namespace: fyp
  labels:
    app: sales-worker
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sales-worker
  template:
    metadata:
      labels:
        app: sales-worker
        tier: backend
    spec:
      containers:
        - name: sales-worker
          image: fyp/sales-agent-service:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - src.worker.celery_app
            - worker
            - --loglevel=info
            - --concurrency=4
          envFrom:
            - secretRef:
                name: backend-secret
            - configMapRef:
                name: app-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "1Gi"
              cpu: "1"

---
apiVersion: v1
kind: Service
metadata:
  name: sales
  namespace: fyp
spec:
  selector:
    app: sales
  ports:
    - port: 8000
      targetPort: 8000
